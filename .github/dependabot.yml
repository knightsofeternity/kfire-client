version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # KFIRE Guilde lives in knightsofeternity/wow-kfire-guilde: a weekly PR moves
  # the submodule to its latest commit.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
